<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d0d0f;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; gap:24px; font-family:'DM Mono',monospace;
  overflow:hidden;
}
.status {
  font-size:12px; color:#fbbf24; letter-spacing:0.12em;
  transition:opacity 0.3s; min-height:18px;
}
.stage {
  width:560px; height:440px;
  position:relative;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:40px;
}

/* LAPTOP WRAPPER - slight 3D desk tilt */
.laptop {
  position:relative;
}

/* BASE */
.base {
  width:480px; height:26px;
  background:linear-gradient(180deg,#2a2a30,#1a1a1e);
  border:1.5px solid #3a3a40;
  border-radius:3px 3px 10px 10px;
  position:relative;
  box-shadow:0 8px 20px rgba(0,0,0,0.6);
  z-index:2;
}
.base::after {
  content:''; position:absolute; left:50%; top:8px;
  transform:translateX(-50%);
  width:55px; height:4px; background:#111; border-radius:2px;
}

/* LID WRAPPER - perspective container, hinged at bottom */
.lid-wrap {
  width:480px;
  height:300px;
  position:relative;
  overflow:visible;
  perspective:2000px;
  perspective-origin:50% 110%;
  transition:perspective 0.15s ease;
}

.lid-wrap.closing {
  perspective:4500px;
}

.lid-wrap.closed {
  perspective:99999px;
  perspective-origin:50% 50%;
}

/* LID - the actual panel that rotates */
.lid {
  width:460px;
  height:295px;
  position:absolute;
  bottom:0;
  left:10px;
  transform-origin:bottom center;
  transform-style:preserve-3d;
  transform:rotateX(13deg);
  transition:transform 1.5s cubic-bezier(0.4,0,0.2,1);
}

.lid-face {
  position:absolute; inset:0;
  background:linear-gradient(175deg,#1e1e26,#141418);
  border:none;
  border-radius:8px 8px 2px 2px;
  overflow:hidden;
  box-shadow:0 -4px 16px rgba(0,0,0,0.5);
}


.screen {
  margin:10px; height:calc(100% - 20px);
  background:#040407; border-radius:4px;
  padding:14px 16px;
  display:flex; flex-direction:column; gap:4px;
}
.sline {
  font-size:11px; color:#6ee7b7; line-height:1.6;
  opacity:0; transform:translateY(5px);
  transition:opacity 0.4s, transform 0.4s;
}
.sline.show { opacity:1; transform:none; }

/* The back of the lid (dark, no content needed) */


/* BACK PANEL */
#backPanel {
  position:absolute;
  bottom:26px; left:0;
  width:480px; height:300px;
  background:linear-gradient(145deg,#18181c,#1c1c22);
  border:1.5px solid #2a2a30;
  border-radius:8px;
  opacity:0; pointer-events:none;
  overflow:visible;
  transition:opacity 0.5s, transform 0.9s;
  box-shadow:0 16px 36px rgba(0,0,0,0.6);
}
.b-label { position:absolute; top:12px; left:16px; font-size:9px; color:#2a2a36; letter-spacing:0.1em; }
.b-vents { position:absolute; bottom:20px; right:20px; display:flex; gap:5px; }
.b-vent { width:10px; height:48px; background:#0e0e12; border-radius:2px; border:1px solid #1c1c22; }

/* SCREWS */
.screw { position:absolute; width:22px; height:22px; opacity:0; transition:opacity 0.3s; }
.screw-head {
  width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #4a4a56,#1e1e26);
  border:1px solid #3e3e4a;
  box-shadow:inset 0 1px 2px rgba(255,255,255,0.07), 0 2px 6px rgba(0,0,0,0.7);
  position:relative;
}
/* inner layer that spins - separate from the lit head */
.screw-cross { position:absolute; inset:0; border-radius:50%; }
.screw-cross::before,.screw-cross::after {
  content:''; position:absolute; border-radius:1px;
  left:50%; top:50%; transform:translate(-50%,-50%);
}
.screw-cross::before { width:13px; height:2.5px; background:linear-gradient(180deg,#2a2a32,#444450); box-shadow:0 1px 2px rgba(0,0,0,0.8); }
.screw-cross::after  { width:2.5px; height:13px; background:linear-gradient(90deg,#2a2a32,#444450); box-shadow:1px 0 2px rgba(0,0,0,0.8); }
/* only spin the cross, not the head so lighting stays static */
.screw.spinning .screw-cross { animation:sc 0.15s linear infinite; }
.screw.spinning .screw-head { animation:none; }
@keyframes sc { to { transform:rotate(360deg); } }

/* INTERNALS */
#internals {
  position:absolute; bottom:26px; left:0;
  width:480px; height:300px;
  opacity:0; pointer-events:none; transition:opacity 0.9s;
}
.fan-group { animation:fan 0.25s linear infinite; }
.fan-group2 { animation:fan2 0.25s linear infinite; }
@keyframes fan2 { to { transform:rotate(-360deg); } } /* spins opposite */
@keyframes fan { to { transform:rotate(360deg); } }
</style>

function setStatus(t){ statusEl.style.opacity='0'; setTimeout(()=>{ statusEl.textContent=t; statusEl.style.opacity='1'; },350); }
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function spinRemove(el,ms){
  el.classList.add('spinning');
  await delay(ms);
  el.classList.remove('spinning');
  el.style.transition='transform 0.35s ease, opacity 0.35s';
  el.style.transform='translateY(-28px) scale(0.05)';
  el.style.opacity='0';
  await delay(380);
}

  backPanel.style.transform='';
  internals.style.transition='none';
  internals.style.opacity='0';
  document.querySelector('.base').style.transition='none';
  document.querySelector('.base').style.opacity='1';
  screws.forEach(s=>{ s.style.transition='none'; s.style.transform=''; s.style.opacity='0'; });
  lines.forEach(l=>l.classList.remove('show'));
  await delay(300);

  // 1. Device detected — laptop open, screen lines appear
  setStatus('DEVICE DETECTED');
  for(let l of lines){ l.classList.add('show'); await delay(320); }
  await delay(1400);

  // 2a. Closing closing — lid rotates with perspective depth
  setStatus('CLOSING LID...');
  document.querySelector('.lid-wrap').classList.add('closing');
  lid.style.transition='transform 1.0s cubic-bezier(0.4,0,0.2,1)';
  lid.style.transform='rotateX(-85.5deg)';
  setTimeout(() => {
    document.querySelector('.screen').style.transition='opacity 0.5s';
    document.querySelector('.screen').style.opacity='0';
  }, 600);
  await delay(1100);

  // 2b. Closing closed — perspective maxes out, screen becomes rectangle
  document.querySelector('.lid-wrap').classList.add('closed');
  lid.style.transition='transform 0.2s ease';
  lid.style.transform='rotateX(-86deg)';
  await delay(300);

  // 3. Fade lid + base, show back panel
  setStatus('FLIPPING DEVICE...');
  lid.style.transition='opacity 0.5s';
  lid.style.opacity='0';
  document.querySelector('.base').style.transition='opacity 0.5s';
  document.querySelector('.base').style.opacity='0';
  await delay(550);
  backPanel.style.transition='opacity 0.5s';
  backPanel.style.opacity='1';
  await delay(500);

  // 4. Screws appear
  setStatus('LOCATING SCREWS...');
  for(let s of screws){ s.style.opacity='1'; await delay(140); }
  await delay(700);

  // 5. Remove screws
  setStatus('REMOVING SCREWS...');
  const times=[550,300,680,340,500,240];
  for(let i=0;i<6;i++){ await spinRemove(screws[i],times[i]); await delay(60); }
  await delay(300);

  // 6. Panel lifts
  setStatus('REMOVING BACK PANEL...');
  backPanel.style.transition='transform 1s ease, opacity 0.8s';
  backPanel.style.transform='translateY(-46px) scale(1.02)';
  backPanel.style.opacity='0';
  await delay(1100);

  // 7. Internals
  setStatus('INTERNALS REVEALED');
  internals.style.transition='opacity 0.9s';
  internals.style.opacity='1';
  await delay(2800);
  setStatus('FAN: ⚠ TOO FAST RPM');
  await delay(2000);
  setStatus('THERMAL PASTE: DRIED ⚠');
  await delay(2000);
  setStatus('→ NEEDS FW TECH SERVICE ←');
  await delay(2500);

  setStatus('RESTARTING...');
  internals.style.transition='opacity 0.6s';
  internals.style.opacity='0';
  await delay(700);
  run();
}

run();
</script>
</body>
</html>
